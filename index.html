<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naldike Chatbot</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="avatar">
                <img src="https://naldike.com/wp-content/uploads/2021/03/cropped-logo-naldike-1.png" alt="Naldike Logo" onerror="this.src='https://via.placeholder.com/40'">
            </div>
            <div class="header-info">
                <h2>Naldike Assistant</h2>
                <span class="status">En línea</span>
            </div>
        </div>
        
        <div class="chat-messages" id="chat-messages">
            <div class="message bot">
                <div class="message-content">
                    Hola, bienvenido a Naldike Store. Soy tu asistente virtual. ¿En qué puedo ayudarte hoy?
                </div>
                <div class="message-time">Justo ahora</div>
            </div>
        </div>

        <div class="chat-input-area">
            <div class="typing-indicator" id="typing-indicator" style="display: none;">
                <span></span><span></span><span></span>
            </div>
            <div class="input-wrapper">
                <input type="text" id="user-input" placeholder="Escribe tu mensaje aquí..." autocomplete="off">
                <button id="send-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
